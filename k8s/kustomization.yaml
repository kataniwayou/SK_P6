# ============================================================================
# kustomization.yaml — the D-03 ordered-apply convenience aggregator.
# ============================================================================
# This is NOT an overlay structure (D-01: raw kubectl YAML, one deploy target).
# It ONLY (a) lists every manifest as a resource so `kubectl apply -k k8s/` is a
# single command, (b) stamps the `skp` namespace + two common labels, and (c) runs
# exactly ONE `configMapGenerator`, for the two Grafana dashboard JSONs only, with
# `disableNameSuffixHash: true`. No templating and no patches.
#
# The hash-suffix opt-out is mandatory, not cosmetic: `23-grafana.yaml`'s volume
# references the generated ConfigMap BY NAME (`grafana-dashboards`), and the default
# generator behaviour would rename it with a content-hash suffix on every edit and
# break that reference. That is the same reason the hand-authored ConfigMaps in
# 02-configmaps.yaml are still NOT generated — they are the canonical drop-in and
# swapping them to a generator would buy nothing while risking the 80-04 volume refs
# (RESEARCH Open-Q4 default). The dashboards are the one justified exception because
# they must be real `.json` files on disk: that is what keeps "the repo JSON is the
# single source of truth" literally true (DASH-03) and what makes the hermetic
# `scripts/phase-87-dashboard-lint.ps1` gate possible — a YAML block scalar embedded
# in this file would be lintable only by re-parsing kustomize output.
#
# APPLY-ORDER NOTE: `kubectl apply -k` sorts by KIND, not by this file's order
# (Namespace first, then CRDs/ConfigMaps/Secrets, then workloads). True infra→app
# readiness ordering (wait-for-healthy between tiers) lives in the bring-up script
# `scripts/phase-80-up.ps1` (phased `kubectl rollout status`), NOT here. The
# resources are still listed in tier order below for human diff-ability.
#
# WHOLE-STACK LINT GATE: `kubectl apply -k k8s/ --dry-run=server` validates the
# entire aggregated stack against the live API server (schema + admission) before
# anything is created — the T-80-14 malformed-manifest guard.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# D-02 — every resource lands in the dedicated `skp` namespace. The manifests
# already hardcode `namespace: skp`; this restates the intent at the aggregate
# level (and namespaces any resource that omitted it). The Namespace object
# itself (00-namespace.yaml) is cluster-scoped and is left untouched.
namespace: skp

# D-03 — additive common labels stamped onto every resource. `commonLabels` is
# deprecated in kustomize v5 (bundled with recent kubectl) and, worse, injects the
# labels into every workload's immutable `spec.selector.matchLabels` + Service
# selectors — a latent foot-gun if a value ever changes (forces delete/recreate).
# The modern `labels:` form with `includeSelectors: false` stamps the labels as
# pure metadata WITHOUT touching selectors, so it is both non-deprecated and
# selector-safe. The per-manifest `app: <tier>` selectors remain the sole,
# hand-authored selector source.
labels:
  - pairs:
      app.kubernetes.io/part-of: skp
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# All 14 manifests, in tier order (namespace → secret/config → stateful backing
# services → observability → app tiers). Kind-sort at apply time still applies.
resources:
  - 00-namespace.yaml
  - 01-secret.yaml
  - 02-configmaps.yaml
  - 10-postgres.yaml
  - 11-redis.yaml
  - 12-rabbitmq.yaml
  - 13-elasticsearch.yaml
  - 20-otel-collector.yaml
  - 21-prometheus.yaml
  - 23-grafana.yaml
  - 30-baseapi-service.yaml
  - 31-orchestrator.yaml
  - 34-orchestrator-rbac.yaml
  - 32-keeper.yaml
  - 33-processor-sample.yaml

# MANDATORY — `23-grafana.yaml`'s `gf-dashboards` volume references the generated
# ConfigMap by the literal name `grafana-dashboards`, so the content-hash suffix must
# be off or every dashboard edit silently orphans that volume reference.
# NOTE: `generatorOptions.labels` is deliberately NOT set. The top-level `labels:`
# block above (with includeSelectors: false) already stamps part-of + managed-by onto
# generated resources too — verified by inspecting the generated ConfigMap in
# `kubectl kustomize k8s/` output — so adding them here would be pure duplication.
generatorOptions:
  disableNameSuffixHash: true

# The repo's ONLY generator. Paths are relative to k8s/; the generated data keys are
# the file BASENAMES (`runtime.json`, `business.json`), which is exactly what Grafana's
# file provider reports back as `meta.provisionedExternalId`.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/runtime.json
      - dashboards/business.json
