# ============================================================================
# keeper — two-consumer recovery worker (Deployment replicas:2, NO Service).
# ============================================================================
# Port of the compose `keeper` block (compose.yaml L233-269). The keeper is a
# PURE CONSUMER — nothing connects to it inbound except the kubelet probe (which
# hits the pod IP directly), so it gets NO Service. Two replicas run the
# two-consumer recovery model (compose deploy.replicas:2 → spec.replicas:2); the
# two pods share the same container-internal :8083 harmlessly (nothing published).
#
# IMAGE (D-04): `keeper:local` + IfNotPresent (local store, no registry;
# rollout restart after rebuild forces fresh bits — T-80-09).
#
# TTL LITERAL (D-08 / T-80-11 CRITICAL): compose shipped the recovery re-materialize
# TTL through an interpolated test-only seam whose absence defaults to 900 (used
# solely by the FALSIFY-02 short-TTL control). Here it is shipped as the bare
# production LITERAL "900" — no shell interpolation appears in this manifest. The two
# reinject fault seams (the defeat hook + the delay hook) are OMITTED ENTIRELY: absent
# ⇒ the code's :-0 default ⇒ OFF, the cleanest expression of "shipped disabled". The
# acceptance grep for the absence of those seam names + any interpolation passes.
#
# PROBES (Pitfall 3 — decoupled): readiness hits /health/ready :8083 which is
# HARD-on-broker (gates Ready only once the bus is up); liveness hits /health/live
# :8083, the always-Healthy self check with a generous initialDelay so a slow ~40s
# rabbitmq cold start never CrashLoops the keeper (Kestrel binds before the broker).
# Compose depends_on is DROPPED (phased bring-up handles ordering).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: skp
  labels:
    app: keeper
    app.kubernetes.io/part-of: skp
spec:
  replicas: 2                                   # compose deploy.replicas:2 — two-consumer recovery
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
    spec:
      containers:
        - name: keeper
          image: keeper:local                  # D-04 — local build, never :latest
          imagePullPolicy: IfNotPresent         # D-04 — read the local store, no registry pull
          env:
            - name: RabbitMq__Host
              value: rabbitmq                                            # verbatim (Service DNS)
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false,connectTimeout=5000"   # verbatim
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"                          # verbatim
            # LITERAL 900 — the compose interpolated recovery-TTL test seam is dropped (D-08 / T-80-11)
            - name: Recovery__ExecutionDataTtlSeconds
              value: "900"
            # NOTE: both keeper reinject fault hooks are OMITTED ENTIRELY (absent ⇒ code :-0 default ⇒ OFF).
          ports:
            - containerPort: 8083                # kubelet-probed pod-local; NO Service
          # startup-gate probe holds off readiness/liveness until boot completes (first beat)
          # — a ~150s grace window (30×5s) comfortably covers a ~40s rabbitmq cold start
          # so a slow boot never CrashLoops (HLTH-07 / T-86-17 / Pitfall 5).
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # readiness is HARD-on-broker — gates Ready only after the bus is reachable
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # liveness is the always-Healthy self check → a slow 40s rabbitmq never CrashLoops (Pitfall 3)
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              memory: "160Mi"
            limits:
              memory: "384Mi"
# NO Service — keeper is a pure consumer (event-driven over the bus; the only
# inbound is the kubelet probe hitting the pod IP directly).
