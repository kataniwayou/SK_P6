# ============================================================================
# orchestrator — Quartz-cron workflow driver (Deployment x3, HA, NO Service).
# ============================================================================
# Port of the compose `orchestrator` block (compose.yaml L185-218). The orchestrator
# is a PURE CONSUMER — nothing connects to it inbound except the kubelet probe (which
# hits the pod IP directly), so it gets NO Service. It runs HA at three replicas: a
# single leader is elected via a Kubernetes coordination Lease (skp/orchestrator-leader,
# see 34-orchestrator-rbac.yaml) and ONLY the leader fires the Quartz cron; followers
# run all other logic (bus consumers, health) and stand by to take over. Receive
# endpoints are already per-replica (POD_NAME-derived InstanceId — D-01), so multiple
# replicas co-exist on the bus safely and no cron double-fires (Phase 82 / SPEC HA-06).
#
# IMAGE (D-04): `orchestrator:local` + IfNotPresent (local store, no registry;
# rollout restart after rebuild forces fresh bits — T-80-09).
#
# IDENTITY (D-01): each pod gets its own identity from a POD_NAME downward-API env
# (metadata.name); Program.cs reads it for BOTH the MassTransit fanout endpoint
# InstanceId and the Lease holder identity. The old hardcoded per-instance identity
# env is DROPPED (a fixed value would collide across the three replicas).
#
# TTL LITERAL (D-08 / T-80-10 CRITICAL): compose shipped the recovery-backup TTL
# through an interpolated test-only seam whose absence defaults to 900 (used solely by
# the FALSIFY-02 short-TTL control). Here it is shipped as the bare production LITERAL
# "900" — no shell interpolation and no test-seam env name appears in this manifest, so
# the acceptance grep for their absence passes. Runtime behavior is identical (900).
#
# PROBES (Pitfall 3 — decoupled): readiness hits /health/ready :8081 which is
# HARD-on-broker (gates Ready only once the bus is up); liveness hits /health/live
# :8081, the always-Healthy self check with a generous initialDelay so a slow ~40s
# rabbitmq cold start never CrashLoops the orchestrator (Kestrel binds before the
# broker). Compose depends_on is DROPPED (phased bring-up handles ordering).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: skp
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: skp
spec:
  replicas: 3                                  # HA — leader-elected via k8s Lease (HA-06)
  # RollingUpdate (the default 25% surge/unavailable): multi-replica is now safe. Each
  # pod declares a per-POD_NAME endpoint (no single-owner queue any more — D-01), so
  # old+new pods co-exist on the bus without contention during a rollout. A rolling
  # deploy that replaces the current leader is just the normal election gap: a follower
  # acquires the Lease and resumes the cron (HA-04). RollingUpdate therefore gives
  # zero-downtime deploys — the whole point of moving off the old single-owner model.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      # dedicated SA (34-orchestrator-rbac.yaml) — grants lease access for election (D-08)
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: orchestrator:local            # D-04 — local build, never :latest
          imagePullPolicy: IfNotPresent         # D-04 — read the local store, no registry pull
          env:
            - name: RabbitMq__Host
              value: rabbitmq                                            # verbatim (Service DNS)
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false,connectTimeout=5000"   # verbatim
            # per-pod identity (D-01) — Program.cs reads POD_NAME for both the fanout
            # endpoint InstanceId and the Lease holder identity (no hardcoded value).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # LITERAL 900 — the compose interpolated test seam is dropped (D-08 / T-80-10)
            - name: Orchestrator__OutputDataTtlSeconds
              value: "900"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"                          # verbatim
          ports:
            - containerPort: 8081                # kubelet-probed pod-local; NO Service
          # startup-gate probe holds off readiness/liveness until boot completes (hydration)
          # — a ~150s grace window (30×5s) comfortably covers a ~40s rabbitmq cold start
          # so a slow boot never CrashLoops (HLTH-07 / T-86-17 / Pitfall 5).
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # readiness is HARD-on-broker — gates Ready only after the bus is reachable
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # liveness is the always-Healthy self check → a slow 40s rabbitmq never CrashLoops (Pitfall 3)
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              memory: "192Mi"
            limits:
              memory: "512Mi"
# NO Service — orchestrator is a pure consumer (event-driven over the bus; the only
# inbound is the kubelet probe hitting the pod IP directly).
